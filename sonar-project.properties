sonar.projectKey=Dhrishit04_EXL_P4_Hackathon1
sonar.organization=dhrishit04

sonar.sources=.
sonar.tests=factory_core/tests,redev_engine/tests,validation_lab/tests
sonar.exclusions=**/tests/**,**/node_modules/**,coverage-*.xml
sonar.test.inclusions=**/tests/**

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage-factory_core.xml,coverage-redev_engine.xml,coverage-validation_lab.xml

# Coverage is measured for the three Python services only. The console has no tests
# yet and the rest are model estate scripts and tooling; drop factory_console/** from
# this list once frontend tests exist and report lcov.
sonar.coverage.exclusions=factory_console/**,model_estate/**,contracts/**,**/sample_data/**,factory_core/scripts/**
